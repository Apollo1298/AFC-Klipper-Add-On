[force_move]
enable_force_move: True

[AFC_extruder extruder]
pin_tool_start: enter_tool_pin
#pin_tool_end: ^!nhk:gpio12
tool_stn: 113.52                # See documentation for details on how to calculate this value. https://armoredturtle.xyz/docs/afc-klipper-add-on/toolhead/calculation.html
tool_stn_unload: 100            # See documentation for details on how to calculate this value. https://armoredturtle.xyz/docs/afc-klipper-add-on/toolhead/calculation.html
tool_sensor_after_extruder: 0   # Distance in mm.
tool_unload_speed: 25           # Unload speed in mm/s. Default is 25mm/s.
tool_load_speed: 25             # Load speed in mm/s. Default is 25mm/s.

#[filament_switch_sensor bypass]
#switch_pin: ^Nightowl:PB5
#pause_on_runout: False


[AFC_buffer TN]
advance_pin: ^NightOwl:TN_ADV    # set advance pin
trailing_pin: ^NightOwl:TN_TRL  # set trailing pin
multiplier_high: 1.05   # default 1.05, factor to feed more filament
multiplier_low:  0.95   # default 0.95, factor to feed less filament

# PSF alternative (comment [AFC_buffer TN] above and uncomment below):
# In [AFC_NightOwl NightOwl] set buffer: PSF and buffer_type: psf
# In [AFC_extruder extruder] set pin_tool_start: psf (and buffer: PSF if set there)
#[AFC_psf PSF]
#sync_feedback_analog_pin: ^NightOwl:PSF_ADC
#sync_feedback_analog_max_compression: 0.75
#sync_feedback_analog_max_tension: 0.25
#sync_feedback_analog_neutral_point: 0.50
#sync_multiplier_low: 0.95
#sync_multiplier_high: 1.05
#flowguard_enabled: True
#flowguard_max_relief: 8


# Minimal Klipper + AFC configuration with PSF proportional sync-feedback.
#
# Pin assignment summary:
#   PC6      AFC_psf psf1 ADC pin (virtual analog via host temperature sensor stand-in)
#
# This file is self-contained for klippy integration tests.

[mcu]
serial: /dev/null

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: PA0
dir_pin: PA1
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
endstop_pin: PA3
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PA4
dir_pin: PA5
enable_pin: !PA6
microsteps: 16
rotation_distance: 40
endstop_pin: PA7
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PB0
dir_pin: PB1
enable_pin: !PB2
microsteps: 16
rotation_distance: 8
endstop_pin: PB3
position_endstop: 0
position_max: 200

[extruder]
step_pin: PB4
dir_pin: PB5
enable_pin: !PB6
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB7
sensor_type: temperature_host
min_temp: 0
max_temp: 250
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114

[heater_bed]
heater_pin: PB8
sensor_type: temperature_host
min_temp: 0
max_temp: 130
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182

[save_variables]
filename: /tmp/afc_klippy_psf_test.cfg

[pause_resume]

[testing]

[AFC]
VarFile: /tmp/afc_klippy_psf_test.var
long_moves_speed: 150
long_moves_accel: 250
short_moves_speed: 50
short_moves_accel: 300
short_move_dis: 10
enable_sensors_in_gui: False
load_to_hub: False
z_hop: 5
resume_speed: 120
resume_z_speed: 30
error_timeout: 36000
tool_cut: False
park: False
poop: False
kick: False
wipe: False
form_tip: False

[AFC_prep]
enable: False

[AFC_form_tip]
cooling_tube_position: 35
cooling_tube_length: 10
cooling_moves: 4

[AFC_extruder extruder]
pin_tool_start: psf
buffer: PSF
buffer_type: psf

[AFC_BoxTurtle unit_1]
hub: hub_1
extruder: extruder
buffer: PSF
buffer_type: psf

[AFC_hub hub_1]
switch_pin: PC5
afc_bowden_length: 900
move_dis: 75
cut: False

[AFC_stepper lane1]
unit: unit_1:1
step_pin: PC0
dir_pin: PC1
enable_pin: !PC2
microsteps: 16
rotation_distance: 4.65
dist_hub: 155.0
park_dist: 10
prep: PC3
load: PC4

[AFC_psf PSF]
sync_feedback_analog_pin: PC6
sync_feedback_analog_max_compression: 0.75
sync_feedback_analog_max_tension: 0.25
sync_feedback_analog_neutral_point: 0.50
sync_multiplier_low: 0.95
sync_multiplier_high: 1.05
flowguard_enabled: True
flowguard_max_relief: 8
